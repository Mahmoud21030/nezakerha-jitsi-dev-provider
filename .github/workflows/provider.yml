name: Temporary Jitsi Live + Recorder

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      room_name:
        required: true
        type: string
      max_minutes:
        required: false
        default: "5"
        type: string
      live_id:
        required: false
        default: ""
        type: string
      callback_url:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-${{ inputs.session_id }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SESSION_ID: ${{ inputs.session_id }}
      ROOM_NAME: ${{ inputs.room_name }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      LIVE_ID: ${{ inputs.live_id }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      CALLBACK_SECRET: ${{ secrets.DEV_LIVE_CALLBACK_SECRET }}
      RECORDER_SECRET: ${{ secrets.DEV_LIVE_RECORDER_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create scoped recorder credential
        if: ${{ inputs.live_id != '' && inputs.callback_url != '' }}
        run: python3 scripts/make-recorder-token.py

      - name: Install tunnel tools
        run: npm install --global pinggy

      - name: Start public endpoints
        id: network
        run: bash ./scripts/start-network.sh

      - name: Callback network ready
        if: ${{ inputs.callback_url != '' }}
        run: python3 scripts/provider-callback.py network_ready

      - name: Start Jitsi
        env:
          MEET_URL: ${{ steps.network.outputs.meet_url }}
          JVB_PUBLIC_IP: ${{ steps.network.outputs.jvb_public_ip }}
          JVB_PUBLIC_PORT: ${{ steps.network.outputs.jvb_public_port }}
        run: bash ./scripts/start-jitsi.sh

      - name: Provider smoke
        env:
          MEET_URL: ${{ steps.network.outputs.meet_url }}
        run: bash ./scripts/smoke-provider.sh

      - name: Callback provider ready
        if: ${{ inputs.callback_url != '' }}
        env:
          MEET_URL: ${{ steps.network.outputs.meet_url }}
        run: python3 scripts/provider-callback.py provider_ready

      - name: Install recorder dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb

      - name: Start resource monitor
        run: |
          mkdir -p runtime
          (
            while true; do
              echo "===== $(date -u +%FT%TZ) ====="
              free -m
              echo "--- load ---"
              uptime
              echo "--- docker ---"
              docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' || true
              echo "--- recorder processes ---"
              ps -eo pid,comm,%cpu,%mem,rss,args --sort=-%cpu | grep -E '[c]hromium|[f]fmpeg|[X]vfb|[p]ulseaudio' | head -n 30 || true
              echo
              sleep 5
            done
          ) >> runtime/resources.log 2>&1 &
          echo $! > runtime/resources.pid

      - name: Run live room + recorder
        env:
          MEET_URL: ${{ steps.network.outputs.meet_url }}
        run: bash ./scripts/run-recorder.sh

      - name: Validate recording
        run: bash ./scripts/validate-recording.sh

      - name: Callback uploading
        if: ${{ inputs.callback_url != '' }}
        env:
          RECORDING_STATUS: uploading
        run: python3 scripts/provider-callback.py uploading

      - name: Upload recording directly to Nezakerha storage
        id: storage
        if: ${{ inputs.callback_url != '' }}
        run: python3 scripts/upload-recording.py

      - name: Callback completed
        if: ${{ inputs.callback_url != '' && success() }}
        env:
          RECORDING_STATUS: completed
          RECORDING_ASSET_ID: ${{ steps.storage.outputs.recording_asset_id }}
        run: python3 scripts/provider-callback.py completed

      - name: Resource summary
        if: always()
        run: |
          if [ -f runtime/resources.pid ]; then kill "$(cat runtime/resources.pid)" 2>/dev/null || true; fi
          echo "=== final memory ==="
          free -h
          echo "=== final load ==="
          uptime
          echo "=== docker stats ==="
          docker stats --no-stream || true
          echo "=== resource log tail ==="
          tail -n 120 runtime/resources.log 2>/dev/null || true

      - name: Upload short-lived QA artifacts
        if: ${{ always() && inputs.callback_url == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jitsi-live-${{ inputs.session_id }}
          path: |
            recordings/
            runtime/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload integration diagnostics
        if: ${{ always() && inputs.callback_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jitsi-live-diagnostics-${{ inputs.session_id }}
          path: runtime/
          retention-days: 1
          if-no-files-found: warn

      - name: Diagnostics
        if: always()
        run: bash ./scripts/diagnostics.sh

      - name: Callback failed
        if: ${{ failure() && inputs.callback_url != '' }}
        env:
          RECORDING_STATUS: failed
          FAILURE_REASON: workflow_failed
        run: python3 scripts/provider-callback.py failed || true

      - name: Callback cancelled
        if: ${{ cancelled() && inputs.callback_url != '' }}
        env:
          RECORDING_STATUS: cancelled
          FAILURE_REASON: workflow_cancelled
        run: python3 scripts/provider-callback.py cancelled || true
